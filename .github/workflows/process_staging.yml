name: Format and Index Staging Assets

on:
  issues:
    types: [closed]
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  organize-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Branch
        id: branch_info
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            echo "target_branch=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "checkout_ref=main" >> $GITHUB_OUTPUT
          else
            echo "target_branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
            echo "checkout_ref=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch_info.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Create Branch if Triggered by Issue
        if: github.event_name == 'issues'
        run: |
          git checkout -b "${{ steps.branch_info.outputs.target_branch }}"

      - name: Restructure Root Files to Asset Subfolder
        run: |
          FOLDER_NAME="assets/clothes/${{ steps.branch_info.outputs.target_branch }}"
          mkdir -p "$FOLDER_NAME"
          
          find . -maxdepth 1 -type f ! -name "README.md" ! -name "LICENSE" ! -name ".gitignore" ! -name "manifest.json" -exec mv {} "$FOLDER_NAME/" \;
          
          echo "Organized raw files into: $FOLDER_NAME"

      - name: Generate Global Community Manifest
        run: |
          python -c '
          import os
          import json

          manifest_path = "manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  data = json.load(f)
          else:
              data = {"assets": []}

          for root, dirs, files in os.walk("assets"):
              if files and not root.endswith("assets"):
                  asset_id = os.path.basename(root)
                  if any(a["id"] == asset_id for a in data["assets"]):
                      continue
                      
                  asset_entry = {
                      "id": asset_id,
                      "files": [os.path.join(root, f).replace("\\", "/") for f in files]
                  }
                  data["assets"].append(asset_entry)

          with open(manifest_path, "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit Structural Organization Changes
        run: |
          git config --global user.name "MH2 Portal Bot"
          git config --global user.email "portal-bot@makehuman2.org"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated layout organization & manifest updates"
          git push origin HEAD:${{ steps.branch_info.outputs.target_branch }} --force
