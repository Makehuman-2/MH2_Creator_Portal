name: Format and Index Staging Assets

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  organize-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Staging Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restructure Root Files to Asset Subfolder
        run: |
          # Determine category by inspecting files or fallback to generic clothes folder
          # In a real environment, you can parse the issue text via gh api if needed
          FOLDER_NAME="assets/clothes/${{ github.head_ref }}"
          mkdir -p "$FOLDER_NAME"
          
          # Move all loose asset components down into the organized folder
          # Exclude core github layout components or markdown files
          find . -maxdepth 1 -type f ! -name "README.md" ! -name "LICENSE" ! -name ".gitignore" -exec mv {} "$FOLDER_NAME/" \;
          
          echo "Organized raw files into: $FOLDER_NAME"

      - name: Generate Global Community Manifest
        run: |
          python -c '
          import os
          import json

          manifest_path = "manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  data = json.load(f)
          else:
              data = {"assets": []}

          # Scan the new folder structure
          asset_list = []
          for root, dirs, files in os.walk("assets"):
              if files and not root.endswith("assets"):
                  asset_id = os.path.basename(root)
                  # Deduplicate if already tracking
                  if any(a["id"] == asset_id for a in data["assets"]):
                      continue
                      
                  asset_entry = {
                      "id": asset_id,
                      "files": [os.path.join(root, f).replace("\\", "/") for f in files]
                  }
                  data["assets"].append(asset_entry)

          with open(manifest_path, "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit Structural Organization Changes
        run: |
          git config --global user.name "MH2 Portal Bot"
          git config --global user.email "portal-bot@makehuman2.org"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated layout organization & manifest updates"
          git push origin HEAD:${{ github.head_ref }}
