name: Index Merged Creator Assets

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update manifest.json from pack_manifest.json
        run: |
          python -c '
          import os
          import json

          manifest_path = "manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = {"assets": []}

          existing_by_id = {str(a.get("id")): a for a in data.get("assets", []) if "id" in a}

          for root, dirs, files in os.walk("assets"):
              asset_files = [
                  os.path.join(root, f).replace("\\", "/")
                  for f in files if f.lower() != "pack_manifest.json"
              ]
              if not asset_files:
                  continue

              pack_meta_path = os.path.join(root, "pack_manifest.json")
              if os.path.exists(pack_meta_path):
                  with open(pack_meta_path, "r", encoding="utf-8") as pm:
                      entry = json.load(pm)
                  entry["files"] = asset_files
              else:
                  asset_id = os.path.basename(root)
                  rel_parts = root.replace("\\", "/").split("/")
                  inferred_type = rel_parts[1] if len(rel_parts) >= 3 else "clothes"
                  entry = existing_by_id.get(asset_id, {
                      "id": asset_id,
                      "name": asset_id.replace("_", " ").title(),
                      "type": inferred_type,
                      "license": "CC0",
                      "description": "Community uploaded asset.",
                      "author": "Community Creator"
                  })
                  entry["files"] = asset_files

              existing_by_id[str(entry["id"])] = entry

          data["assets"] = list(existing_by_id.values())
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          '

      - name: Commit Updated manifest.json
        run: |
          git config --global user.name "MH2 Portal Bot"
          git config --global user.email "portal-bot@makehuman2.org"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated manifest.json index update"
          git push

